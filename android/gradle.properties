org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError --enable-native-access=ALL-UNNAMED
# Batasi jumlah worker dan matikan build paralel agar tidak boros RAM
# di mesin 16GB. Dart compiler juga butuh memori, jadi jangan biarkan
# banyak JVM hidup bersamaan.
org.gradle.workers.max=2
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configureondemand=false
# Kotlin daemon tetap terpisah tapi heap-nya kecil
kotlin.daemon.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=384m
android.useAndroidX=true
android.nonTransitiveRClass=true
android.newDsl=false
# Plugin seperti share_plus 13+ relies on AGP's built-in Kotlin
# (they only apply the Kotlin Gradle Plugin when AGP < 9).
android.builtInKotlin=true
